<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas dos Movimentos Artísticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Um livro-espécime antigo: papel creme, molduras verde-sálvia com ornamentos de concha, vinhetas em vermelho-tijolo. Índice à esquerda, página do livro à direita. */
  --paper:#f3eee0; --paper-deep:#e8e0cb; --sage:#7f9e8f; --sage-deep:#557565; --rust:#b04a37; --ink:#2b2621; --muted:#6c6357; --desk:#c7a57d;
  --display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --fell:"IM Fell English",Georgia,serif;
  --body:"EB Garamond",Garamond,Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;
  background-image:repeating-linear-gradient(92deg,rgba(120,80,40,.08) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(255,240,210,.10) 0 1px,transparent 1px 23px),linear-gradient(180deg,#cfae85,#b99368)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
img{max-width:100%;display:block}

.app{display:grid;grid-template-columns:300px 1fr;gap:22px;height:100%;padding:22px;max-width:1500px;margin:0 auto}

/* ---------- Índice (página esquerda) ---------- */
.index{background:var(--paper);position:relative;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 1px 0 #fff8 inset, -6px 8px 18px rgba(60,35,10,.35);border-radius:2px 0 0 2px}
.index::after{content:"";position:absolute;top:0;right:0;bottom:0;width:26px;background:linear-gradient(90deg,transparent,rgba(90,60,20,.16));pointer-events:none}
.index-head{padding:26px 22px 10px;text-align:center}
.index-head h2{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.06em;margin:6px 0 2px}
.index-head p{margin:0;color:var(--muted);font-style:italic;font-size:15px}
.search{margin:10px 22px 6px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--sage);padding:4px 2px}
.search input{border:0;background:transparent;font:inherit;font-style:italic;font-size:16px;width:100%;color:var(--ink);outline:none}
.toc{overflow-y:auto;padding:4px 14px 28px 22px;flex:1;scrollbar-width:thin;scrollbar-color:var(--sage) transparent}
.era{font-family:var(--display);color:var(--rust);font-size:15px;letter-spacing:.08em;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.era::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--rust),transparent);opacity:.5}
.toc button{display:grid;grid-template-columns:28px 1fr;gap:4px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:4px 6px;border-radius:2px;font-size:16.5px;line-height:1.25}
.toc button .n{font-family:var(--fell);font-style:italic;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.toc button .p{display:block;font-size:13px;color:var(--muted);font-style:italic}
.toc button:hover{background:var(--paper-deep)}
.toc button[aria-current="true"]{background:var(--sage-deep);color:var(--paper)}
.toc button[aria-current="true"] .n,.toc button[aria-current="true"] .p{color:#dfe8e1}

/* ---------- Página do livro ---------- */
.leaf{background:var(--paper);position:relative;overflow:hidden;box-shadow:8px 8px 20px rgba(60,35,10,.35);border-radius:0 2px 2px 0;
  background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.5),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(170,140,90,.13),transparent 55%)}
.leaf::before{content:"";position:absolute;top:0;left:0;bottom:0;width:30px;background:linear-gradient(90deg,rgba(90,60,20,.18),transparent);pointer-events:none;z-index:3}
.frame{position:absolute;inset:18px;border:3px solid var(--sage);pointer-events:none;z-index:2}
.frame::before{content:"";position:absolute;inset:6px;border:1px solid var(--sage)}
.frame::after{content:"";position:absolute;inset:11px;border:1px dotted var(--sage);opacity:.55}
.corner{position:absolute;width:92px;height:92px;color:var(--sage-deep)}
.corner.tl{top:-26px;left:-26px}.corner.tr{top:-26px;right:-26px;transform:scaleX(-1)}
.corner.bl{bottom:-26px;left:-26px;transform:scaleY(-1)}.corner.br{bottom:-26px;right:-26px;transform:scale(-1,-1)}
.edge{position:absolute;color:var(--sage-deep);background:var(--paper)}
.edge{width:120px;height:26px}
.edge.t,.edge.b{left:50%;margin-left:-60px}.edge.t{top:-13px}.edge.b{bottom:-13px;transform:scaleY(-1)}
.edge.l,.edge.r{top:50%;margin-top:-13px}.edge.l{left:-60px;transform:rotate(-90deg)}.edge.r{right:-60px;transform:rotate(90deg)}
.scroll{position:absolute;inset:18px;overflow-y:auto;padding:58px clamp(22px,6%,74px) 70px;scrollbar-width:thin;scrollbar-color:var(--sage) transparent;z-index:1}
.folio{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-family:var(--fell);font-style:italic;font-size:14px;color:var(--muted);z-index:2;pointer-events:none}

.headpiece{display:block;width:min(420px,80%);height:30px;margin:0 auto 14px;color:var(--rust)}
h1{font-family:var(--display);font-weight:400;text-align:center;font-size:clamp(30px,4vw,46px);letter-spacing:.06em;margin:0;line-height:1.1;text-wrap:balance}
.kicker{text-align:center;font-style:italic;color:var(--muted);margin:6px 0 0}
.tailpiece{display:block;width:90px;height:22px;margin:22px auto;color:var(--sage-deep)}

/* ---------- Perfil estilo Instagram ---------- */
.profile{display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,4vw,46px);align-items:center;max-width:860px;margin:22px auto 6px}
.avatar{width:clamp(110px,15vw,168px);aspect-ratio:1;border-radius:50%;padding:6px;background:conic-gradient(from 210deg,var(--rust),#d39a52,var(--sage),var(--sage-deep),var(--rust))}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid var(--paper)}
.who h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.2vw,38px);margin:0;letter-spacing:.04em;line-height:1.1}
.who .handle{font-style:italic;color:var(--muted);margin:2px 0 10px}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 10px;font-size:16px}
.stats b{font-family:var(--fell);font-size:20px;font-weight:400;color:var(--rust)}
.who .bio{margin:0;max-width:60ch}

.highlights{display:flex;gap:18px;overflow-x:auto;padding:16px 4px 8px;max-width:860px;margin:6px auto 0;scrollbar-width:none}
.hl{flex:0 0 auto;width:92px;background:none;border:0;padding:0;text-align:center;font-size:14px;line-height:1.2}
.hl .ring{width:76px;height:76px;margin:0 auto 6px;border-radius:50%;padding:3px;border:1.5px solid var(--sage-deep)}
.hl .ring img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.hl .ring.ico{display:grid;place-items:center;color:var(--rust);background:var(--paper-deep)}
.hl[aria-pressed="true"] .ring{border:3px solid var(--rust)}

.tabs{display:flex;justify-content:center;gap:clamp(14px,4vw,48px);border-top:1px solid var(--sage);max-width:860px;margin:14px auto 0}
.tabs button{background:none;border:0;border-top:2px solid transparent;margin-top:-1px;padding:12px 2px;font-family:var(--display);letter-spacing:.12em;font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{border-top-color:var(--ink);color:var(--ink)}
.filterbar{max-width:860px;margin:8px auto 0;display:flex;justify-content:space-between;align-items:center;gap:10px;font-style:italic;color:var(--muted);font-size:15px;min-height:26px}
.filterbar button{background:none;border:1px solid var(--sage);padding:1px 10px;border-radius:20px;font-style:normal;font-size:14px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:860px;margin:10px auto 0}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--paper-deep);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .4s;filter:sepia(.08)}
.tile .ov{position:absolute;inset:0;background:rgba(32,28,22,.62);color:#f6f0e2;opacity:0;transition:opacity .2s;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;text-align:left;font-size:14px;line-height:1.25}
.tile .ov b{font-family:var(--fell);font-weight:400;font-size:15px}
.tile:hover .ov,.tile:focus-visible .ov{opacity:1}
.tile:hover img{transform:scale(1.04)}
.tile .tag{position:absolute;top:6px;right:6px;background:rgba(243,238,224,.9);color:var(--rust);font-family:var(--display);font-size:11px;letter-spacing:.08em;padding:1px 6px;border-radius:2px}

/* ---------- Textos ---------- */
.prose{max-width:66ch;margin:0 auto}
.prose h3{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.05em;text-align:center;margin:34px 0 8px;color:var(--ink)}
.prose h3 + .rule{display:block;width:150px;height:14px;margin:0 auto 14px;color:var(--rust)}
.prose p{margin:0 0 12px;text-align:justify;hyphens:auto}
.dropcap::first-letter{float:left;font-family:var(--display);font-size:62px;line-height:1;color:var(--ink);padding:10px 14px 8px;margin:4px 12px 0 0;
  background:var(--paper);border:3px double var(--rust);box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--rust)}
.prose ul{padding-left:1.2em;margin:0 0 12px}
.prose li{margin:0 0 6px}
.prose li::marker{content:"❧  ";color:var(--rust)}
.note{border-left:3px solid var(--sage);background:rgba(127,158,143,.1);padding:10px 16px;margin:12px 0;font-style:italic}
.timeline{list-style:none;padding:0;margin:0;border-left:2px solid var(--sage);margin-left:8px}
.timeline li{position:relative;padding:0 0 12px 22px}
.timeline li::marker{content:""}
.timeline li::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--rust)}
.timeline b{font-family:var(--fell);font-weight:400;color:var(--rust);display:block;font-variant-numeric:tabular-nums}
dl.kw{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
dl.kw dt{font-family:var(--fell);font-style:italic;color:var(--sage-deep)}
dl.kw dd{margin:0}
.artist-card{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:start;max-width:820px;margin:0 auto 26px;padding-bottom:22px;border-bottom:1px dotted var(--sage)}
.artist-card img{width:150px;height:150px;object-fit:cover;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--sage-deep);cursor:pointer}
.artist-card h4{font-family:var(--display);font-weight:400;font-size:24px;margin:0;letter-spacing:.04em}
.artist-card .meta{font-style:italic;color:var(--rust);margin:0 0 6px}
.artist-card .works{font-size:15.5px;color:var(--muted)}
.artist-card .thumbs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.artist-card .thumbs button{border:0;padding:0;background:none}
.artist-card .thumbs img{width:64px;height:64px;border-radius:2px;box-shadow:none;border:0}

/* ---------- Capa ---------- */
.cover-title{font-size:clamp(36px,5.4vw,64px)}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 12px;max-width:980px;margin:26px auto 0}
.mv{background:none;border:0;padding:0;text-align:center;font-size:14.5px;line-height:1.2}
.mv .ring{width:96px;height:96px;margin:0 auto 6px;border-radius:50%;padding:3px;background:conic-gradient(var(--rust),#d39a52,var(--sage),var(--rust))}
.mv .ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid var(--paper)}
.mv small{display:block;color:var(--muted);font-style:italic;font-size:12.5px}
.mv:hover .ring{transform:rotate(-4deg)}

/* ---------- Publicação aberta ---------- */
.modal{position:fixed;inset:0;background:rgba(30,22,14,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal.open{display:flex}
.post{background:var(--paper);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);max-width:1180px;width:100%;max-height:100%;height:min(820px,100%);position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.post .pic{background:#1f1b17;display:flex;align-items:center;justify-content:center;min-height:0}
.post .pic img{max-height:100%;max-width:100%;object-fit:contain}
.post .side{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--sage)}
.post .side header{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--paper-deep)}
.post .side header img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--rust)}
.post .side header b{font-family:var(--fell);font-weight:400;font-size:18px;display:block;line-height:1.15}
.post .side header span{font-size:14px;color:var(--muted);font-style:italic}
.post .body{overflow-y:auto;padding:16px 20px 20px;font-size:17px}
.post .body h3{font-family:var(--fell);font-weight:400;font-size:25px;line-height:1.2;margin:0 0 2px;text-wrap:balance}
.post .body .date{color:var(--rust);font-style:italic;margin:0 0 10px}
.post .body h4{font-family:var(--display);font-weight:400;letter-spacing:.08em;font-size:15px;color:var(--sage-deep);margin:18px 0 4px;border-bottom:1px solid var(--paper-deep);padding-bottom:2px}
.post .body p{margin:0 0 10px}
.post .foot{border-top:1px solid var(--paper-deep);padding:10px 18px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{position:fixed;top:14px;right:18px;background:none;border:0;color:#f3eee0;font-size:34px;line-height:1;z-index:60}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(243,238,224,.92);color:var(--ink);font-size:24px;z-index:60;display:grid;place-items:center}
.nav.prev{left:14px}.nav.next{right:14px}
.menu-btn{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr;padding:10px}
  .index{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:40;transform:translateX(-105%);transition:transform .25s}
  .index.open{transform:none}
  .menu-btn{display:inline-flex;position:fixed;left:16px;top:16px;z-index:41;background:var(--paper);border:1.5px solid var(--sage-deep);padding:6px 12px;font-family:var(--display);letter-spacing:.08em;font-size:14px;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .scroll{padding:64px 18px 64px}
  .post{grid-template-columns:1fr;grid-template-rows:minmax(0,46%) 1fr;height:100%}
  .post .side{border-left:0;border-top:1px solid var(--sage)}
  .profile{grid-template-columns:1fr;justify-items:center;text-align:center}
  .stats{justify-content:center}
  .artist-card{grid-template-columns:1fr;justify-items:center;text-align:center}
  .nav{display:none}
}
@media (max-width:480px){ .grid{gap:3px} .corner{width:64px;height:64px} .tile .tag{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="corner" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M30 30 L30 98 M30 30 L98 30" stroke-width="3"/>
        <path d="M36 36 L36 98 M36 36 L98 36" stroke-width="1"/>
        <path d="M30 60 C 14 62, 6 50, 12 40 C 16 33, 24 36, 22 42" />
        <path d="M60 30 C 62 14, 50 6, 40 12 C 33 16, 36 24, 42 22" />
        <path d="M30 78 C 20 80, 16 74, 19 69" stroke-width="1.2"/>
        <path d="M78 30 C 80 20, 74 16, 69 19" stroke-width="1.2"/>
      </g>
      <g id="shell" fill="currentColor"></g>
      <circle cx="30" cy="30" r="4.5" fill="currentColor"/>
    </symbol>
    <symbol id="edge" viewBox="0 0 120 26">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M2 14 H38 M82 14 H118"/>
        <path d="M60 14 C 52 2, 40 4, 42 12 C 43 17, 50 16, 49 11"/>
        <path d="M60 14 C 68 2, 80 4, 78 12 C 77 17, 70 16, 71 11"/>

      </g>
      <path d="M60 4 C 63 9, 63 13, 60 18 C 57 13, 57 9, 60 4Z" fill="currentColor"/>
    </symbol>
    <symbol id="head" viewBox="0 0 420 30">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M6 18 H170 M250 18 H414" stroke-width="2.4"/>
        <path d="M6 22 H170 M250 22 H414" stroke-width=".8"/>
        <path d="M170 20 C 182 8, 196 6, 200 14 C 203 20, 196 24, 192 19" stroke-width="1.6"/>
        <path d="M250 20 C 238 8, 224 6, 220 14 C 217 20, 224 24, 228 19" stroke-width="1.6"/>
        <path d="M6 20 C 0 14, 2 10, 8 12 M414 20 C 420 14, 418 10, 412 12" stroke-width="1.4"/>
      </g>
      <g fill="currentColor">
        <path d="M210 2 C 218 8, 218 16, 210 26 C 202 16, 202 8, 210 2Z"/>
        <path d="M210 16 C 198 8, 190 12, 196 20 C 200 24, 206 22, 210 16Z" opacity=".75"/>
        <path d="M210 16 C 222 8, 230 12, 224 20 C 220 24, 214 22, 210 16Z" opacity=".75"/>
        <circle cx="182" cy="20" r="2.4"/><circle cx="238" cy="20" r="2.4"/>
      </g>
    </symbol>
    <symbol id="rule" viewBox="0 0 150 14">
      <g fill="currentColor"><path d="M75 1 L80 7 L75 13 L70 7Z"/><circle cx="60" cy="7" r="1.8"/><circle cx="90" cy="7" r="1.8"/></g>
      <path d="M4 7 H52 M98 7 H146" stroke="currentColor" stroke-width="1"/>
    </symbol>

      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <path d="M45 11 C 35 0, 18 2, 20 12 C 22 20, 32 18, 30 12"/>
        <path d="M45 11 C 55 0, 72 2, 70 12 C 68 20, 58 18, 60 12"/>

      </g>
      <circle cx="45" cy="11" r="3" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<button class="menu-btn" id="menuBtn" aria-controls="index" aria-expanded="false">☰ Sumário</button>
<div class="app">
  <nav class="index" id="index" aria-label="Sumário dos movimentos">
    <div class="index-head">
      <svg class="tailpiece" style="margin:0 auto;color:var(--rust)"><use href="#tail"/></svg>
      <h2>Sumário</h2>
      <p>79 movimentos em ordem cronológica</p>
    </div>
    <label class="search" for="q"><span aria-hidden="true" style="color:var(--sage-deep)">⌕</span><input id="q" type="search" placeholder="Procurar movimento ou artista"></label>
    <div class="toc" id="toc"></div>
  </nav>

  <main class="leaf" aria-live="polite">
    <div class="frame" aria-hidden="true">
      <svg class="corner tl"><use href="#corner"/></svg><svg class="corner tr"><use href="#corner"/></svg>
      <svg class="corner bl"><use href="#corner"/></svg><svg class="corner br"><use href="#corner"/></svg>
      <svg class="edge t"><use href="#edge"/></svg><svg class="edge b"><use href="#edge"/></svg>
      <svg class="edge l"><use href="#edge"/></svg><svg class="edge r"><use href="#edge"/></svg>
    </div>
    <div class="scroll" id="page"><p style="text-align:center;font-style:italic;margin-top:30vh">Abrindo o livro…</p></div>
    <div class="folio" id="folio"></div>
  </main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Obra">
  <button class="x" id="mClose" aria-label="Fechar">×</button>
  <button class="nav prev" id="mPrev" aria-label="Obra anterior">‹</button>
  <button class="nav next" id="mNext" aria-label="Próxima obra">›</button>
  <article class="post" id="post"></article>
</div>

<script>
(function(){const g=document.getElementById('shell');let h='';
 for(let k=0;k<9;k++){const a=(186+k*10.5)*Math.PI/180,L=k%2?22:27,cx=30,cy=30,x=cx+Math.cos(a)*L,y=cy+Math.sin(a)*L,w=0.16;
  const x1=cx+Math.cos(a-w)*L*.55,y1=cy+Math.sin(a-w)*L*.55,x2=cx+Math.cos(a+w)*L*.55,y2=cy+Math.sin(a+w)*L*.55;
  h+=`<path d="M${cx} ${cy} Q${x1.toFixed(1)} ${y1.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)} Q${x2.toFixed(1)} ${y2.toFixed(1)} ${cx} ${cy}Z" opacity="${k%2?.6:.95}"/>`;}
 g.innerHTML=h;})();
const ERAS=[[1,'Pré-História e Antiguidade'],[7,'Idade Média'],[10,'Renascimento'],[14,'Barroco e Rococó'],[20,'Do Neoclássico ao Realismo'],[31,'Impressionismo e fim de século'],[42,'Vanguardas modernas'],[63,'Pós-guerra e contemporânea'],[78,'Apêndice · conceitos de análise']];
const KIND={destaque:'Destaque',artista:'Artista',obra:'Obra',periodo:'Período',galeria:'Galeria'};
let DATA=[],BY={},cur=null,tab='obras',filter=null,list=[],pos=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=id=>'m-'+id.replace(/_/g,'-');
const head='<svg class="headpiece"><use href="#head"/></svg>';
const rule='<svg class="rule"><use href="#rule"/></svg>';
const tail='<svg class="tailpiece"><use href="#tail"/></svg>';

fetch('data.json').then(r=>r.json()).then(async d=>{DATA=d;d.forEach(m=>BY[slug(m.id)]=m);await loadAvatars();buildToc();route();})
 .catch(()=>{$('#page').innerHTML='<p style="text-align:center;margin-top:30vh">Não foi possível carregar os dados. Recarregue a página.</p>'});

async function loadImg(src){const im=new Image();im.src=src;await im.decode();return im}
function cut(im,x,y,w,h,q){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,x,y,w,h,0,0,w,h);
  return new Promise(r=>c.toBlob(b=>r(URL.createObjectURL(b)),'image/jpeg',q||.92))}
async function loadAvatars(){const im=await loadImg('atlas/avatars.jpg');await Promise.all(DATA.map(async(m,i)=>{m.avs=await cut(im,(i%10)*150,Math.floor(i/10)*150,150,150)}))}
async function prepare(m){if(m.ready)return;
  const ims=await Promise.all(m.atlas.map(loadImg));
  await Promise.all(m.posts.map(async p=>{p.src=await cut(ims[p.a],...p.r)}));m.ready=true}
function buildToc(q=''){
  q=q.trim().toLowerCase();let h='',e=0;
  DATA.forEach(m=>{
    while(e<ERAS.length&&m.num>=ERAS[e][0]){ if(!q) h+=`<div class="era">${ERAS[e][1]}</div>`; e++; }
    const hay=(m.name+' '+m.arts+' '+m.artists.map(a=>a.name).join(' ')).toLowerCase();
    if(q&&!hay.includes(q))return;
    h+=`<button data-k="${slug(m.id)}" aria-current="${cur===m}"><span class="n">${m.num}</span><span>${esc(m.name)}<span class="p">${esc(m.period)}</span></span></button>`;
  });
  $('#toc').innerHTML=h||'<p style="font-style:italic;color:var(--muted)">Nada encontrado.</p>';
}
$('#toc').addEventListener('click',e=>{const b=e.target.closest('button');if(b){location.hash=b.dataset.k;closeMenu();}});
$('#q').addEventListener('input',e=>buildToc(e.target.value));
$('#menuBtn').addEventListener('click',()=>{const o=$('#index').classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',o)});
function closeMenu(){$('#index').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded',false)}
window.addEventListener('hashchange',route);

let rt=0;
async function route(){
  const h=location.hash.slice(1),me=++rt;
  cur=BY[h]||null; tab='obras'; filter=null;
  if(cur&&!cur.ready){$('#page').innerHTML=`${head}<p class="kicker" style="margin-top:22vh">Virando a página para ${esc(cur.name)}…</p>`;
    try{await prepare(cur)}catch(e){$('#page').innerHTML='<p class="kicker" style="margin-top:22vh">As imagens não carregaram. Recarregue a página.</p>';return}
    if(me!==rt)return;}
  document.querySelectorAll('#toc button').forEach(b=>b.setAttribute('aria-current',b.dataset.k===h));
  const a=document.querySelector(`#toc button[data-k="${h}"]`); if(a)a.scrollIntoView({block:'nearest'});
  cur?renderMovement():renderCover();
  $('#page').scrollTop=0;
}

function renderCover(){
  $('#folio').textContent='— frontispício —';
  $('#page').innerHTML=`${head}<h1 class="cover-title">Movimentos Artísticos</h1>
  <p class="kicker">Análise de estilo e história visual · da Pré-História à arte contemporânea</p>
  ${tail}
  <div class="prose"><p class="dropcap">Este atlas reúne setenta e nove movimentos em ordem cronológica, com mais de mil e seiscentas imagens. Cada movimento abre como um perfil: as publicações mostram obras, artistas e cenas do período; os destaques apresentam os artistas principais; e a aba “Sobre” traz o contexto histórico, as técnicas, as leituras de Gombrich e de Katy Hessel, uma linha do tempo, o vocabulário e onde ver as obras. Escolha um movimento no sumário ou num dos círculos abaixo.</p></div>
  <div class="mosaic">${DATA.map(m=>`<button class="mv" data-k="${slug(m.id)}"><div class="ring"><img loading="lazy" src="${m.avs}" alt=""></div>${esc(m.name)}<small>${esc(m.period)}</small></button>`).join('')}</div>
  <p class="kicker" style="margin-top:34px;font-size:14px">Material de estudo · PROF-ARTES / UFMS · imagens reunidas sem fins comerciais, direitos reservados aos artistas e detentores.</p>`;
  $('#page').querySelectorAll('.mv').forEach(b=>b.onclick=()=>location.hash=b.dataset.k);
}

function shown(){return cur.posts.map((p,i)=>({...p,i})).filter(p=>filter===null||(filter==='periodo'?(p.kind==='periodo'||p.kind==='destaque'):p.ai===filter))}

function renderMovement(){
  const m=cur;
  $('#folio').textContent=`— ${m.num} —`;
  const nArt=m.artists.length;
  const hls=m.artists.map((a,i)=>{const p=m.posts.find(x=>x.kind==='artista'&&x.ai===i);return `<button class="hl" data-f="${i}" aria-pressed="${filter===i}"><div class="ring"><img src="${p.src}" alt=""></div>${esc(a.name)}</button>`}).join('')
   +`<button class="hl" data-f="periodo" aria-pressed="${filter==='periodo'}"><div class="ring"><img src="${m.posts.find(x=>x.kind==='periodo')?.src||m.posts[0].src}" alt=""></div>O período</button>`
   +`<button class="hl" data-t="sobre"><div class="ring ico"><svg width="58" height="16"><use href="#tail"/></svg></div>Linha do tempo</button>`;
  $('#page').innerHTML=`${head}
  <section class="profile">
    <div class="avatar"><img src="${m.posts[0].src}" alt="${esc(m.posts[0].title)}"></div>
    <div class="who">
      <h2>${esc(m.name)}</h2>
      <p class="handle">${m.app?'Apêndice · ':''}${esc(m.period)}</p>
      <p class="stats"><span><b>${m.posts.length}</b> publicações</span><span><b>${nArt}</b> artistas</span><span><b>${m.tl.length}</b> marcos históricos</span></p>
      <p class="bio">${esc(m.sub||m.label||'')}${m.sub||m.label?' · ':''}<i>${esc(m.arts)}</i></p>
    </div>
  </section>
  <div class="highlights" role="toolbar" aria-label="Destaques">${hls}</div>
  <div class="tabs" role="tablist">
    ${[['obras','Publicações'],['artistas','Artistas'],['sobre','Sobre']].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join('')}
  </div>
  <div id="tabbody"></div>
  <div style="display:flex;justify-content:space-between;max-width:860px;margin:34px auto 0;font-style:italic">
    ${m.num>1?`<a href="#${slug(DATA[m.num-2].id)}" style="color:var(--sage-deep)">‹ ${esc(DATA[m.num-2].name)}</a>`:'<span></span>'}
    ${m.num<DATA.length?`<a href="#${slug(DATA[m.num].id)}" style="color:var(--sage-deep)">${esc(DATA[m.num].name)} ›</a>`:'<span></span>'}
  </div>`;
  $('#page').querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;filter=null;renderMovement()});
  $('#page').querySelectorAll('.hl').forEach(b=>b.onclick=()=>{
    if(b.dataset.t){tab='sobre';filter=null;renderMovement();document.getElementById('linha')?.scrollIntoView({behavior:'smooth'});return}
    const f=b.dataset.f==='periodo'?'periodo':+b.dataset.f; filter=(filter===f)?null:f; tab='obras'; renderMovement();
  });
  renderTab();
}

function renderTab(){
  const m=cur,el=$('#tabbody');
  if(tab==='obras'){
    const L=shown();
    const fa=filter===null?'':filter==='periodo'?'Cenas e obras do período':m.artists[filter].name;
    el.innerHTML=`<div class="filterbar"><span>${filter===null?'Todas as publicações · toque numa imagem para abrir':esc(fa)+' · '+L.length+' publicações'}</span>${filter!==null?'<button id="clr">Mostrar todas</button>':''}</div>
    ${filter!==null&&filter!=='periodo'?`<div class="prose note" style="max-width:860px;margin:10px auto 0"><b style="font-style:normal">${esc(m.artists[filter].name)}</b> · ${esc(m.artists[filter].meta)}<br>${esc(m.artists[filter].bio)}</div>`:''}
    <div class="grid">${L.map(p=>`<button class="tile" data-i="${p.i}" aria-label="${esc((p.artist?p.artist+', ':'')+p.title)}"><img loading="lazy" src="${p.src}" alt=""><span class="tag">${KIND[p.kind]}</span><span class="ov"><b>${esc(p.title)}</b>${esc(p.artist)}${p.date?' · '+esc(p.date):''}</span></button>`).join('')}</div>`;
    el.querySelector('#clr')?.addEventListener('click',()=>{filter=null;renderMovement()});
    el.querySelectorAll('.tile').forEach(t=>t.onclick=()=>openPost(+t.dataset.i,L.map(p=>p.i)));
  } else if(tab==='artistas'){
    el.innerHTML=`<div style="margin-top:10px">`+m.artists.map((a,i)=>{
      const ps=m.posts.map((p,j)=>({...p,j})).filter(p=>p.ai===i);
      const face=ps.find(p=>p.kind==='artista')||ps[0];
      const hd=(i===0?`<div class="prose"><h3>Artistas em destaque</h3>${rule}</div>`:'')+(a.extra&&!m.artists[i-1].extra?`<div class="prose" style="margin-top:10px"><h3>Mais artistas e obras do período</h3>${rule}</div>`:'');
      if(!face) return '';
      return hd+`<div class="artist-card"><img src="${face.src}" alt="${esc(a.name)}" data-j="${face.j}">
      <div><h4>${esc(a.name)}</h4><p class="meta">${esc(a.meta)}</p><p>${esc(a.bio)}</p>
      ${a.works.length?`<p class="works"><i>Obras de referência (títulos de catálogo):</i> ${esc(a.works.join('; '))}</p>`:''}
      <div class="thumbs">${ps.map(p=>`<button data-j="${p.j}" aria-label="${esc(p.title)}"><img loading="lazy" src="${p.src}" alt=""></button>`).join('')}</div></div></div>`}).join('')+
      `<div class="prose"><h3>Outros nomes do movimento</h3>${rule}<p style="text-align:center"><i>${esc(m.arts)}</i></p></div></div>`;
    el.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;openPost(j,m.posts.map((p,k)=>k).filter(k=>m.posts[k].ai===m.posts[j].ai))});
  } else {
    el.innerHTML=`<div class="prose">
      <h3>O movimento</h3>${rule}<p class="dropcap">${esc(m.text)}</p>
      <h3>Características</h3>${rule}<ul>${m.chars.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
      <h3>Contexto histórico</h3>${rule}<p class="dropcap">${esc(m.ctx)}</p>
      <h3>Técnicas e materiais</h3>${rule}<p>${esc(m.tec)}</p>
      <h3>Leituras</h3>${rule}
      <div class="note"><b style="font-style:normal;font-family:var(--fell)">Segundo Gombrich (A História da Arte)</b><br>${esc(m.gom)}</div>
      <div class="note"><b style="font-style:normal;font-family:var(--fell)">Mulheres no período (perspectiva de Katy Hessel, A História da Arte sem os Homens)</b><br>${esc(m.mul)}</div>
      <h3 id="linha">Linha do tempo</h3>${rule}<ul class="timeline">${m.tl.map(([d,t])=>`<li><b>${esc(d)}</b>${esc(t)}</li>`).join('')}</ul>
      <h3>Vocabulário</h3>${rule}<dl class="kw">${m.kw.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>
      <h3>Onde ver</h3>${rule}<ul>${m.places.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
      <h3>Para ler mais</h3>${rule}<ul>${m.refs.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
      ${tail}</div>`;
  }
}

function openPost(i,L){list=L;pos=Math.max(0,L.indexOf(i));showPost();$('#modal').classList.add('open');document.body.style.overflow='hidden';$('#mClose').focus()}
function closePost(){$('#modal').classList.remove('open');document.body.style.overflow=''}
function showPost(){
  const m=cur,p=m.posts[list[pos]],a=p.ai>=0&&p.ai!==null?m.artists[p.ai]:null;
  const face=a?(m.posts.find(x=>x.kind==='artista'&&x.ai===p.ai)||p).src:m.posts[0].src;
  const title=p.kind==='artista'||p.kind==='destaque'||p.kind==='periodo'?p.title:p.title;
  $('#post').innerHTML=`<div class="pic"><img src="${p.src}" alt="${esc(p.title)}"></div>
  <div class="side">
    <header><img src="${face}" alt=""><div><b>${esc(a?a.name:(p.artist||m.name))}</b><span>${esc(a?a.meta:m.period)}</span></div></header>
    <div class="body">
      <p style="margin:0 0 4px;font-family:var(--display);letter-spacing:.1em;font-size:13px;color:var(--rust)">${KIND[p.kind]} · ${esc(m.name)}</p>
      <h3>${esc(title)}</h3>
      ${p.artist&&!a?`<p class="date">${esc(p.artist)}${p.date?', '+esc(p.date):''}</p>`:p.date?`<p class="date">${esc(p.date)}</p>`:''}
      ${p.note?`<p class="note" style="margin-top:6px">${esc(p.note)}</p>`:''}
      ${p.kind==='galeria'?'<p style="font-size:14px;color:var(--muted);font-style:italic">Título conforme o catálogo de origem.</p>':''}
      ${a?`<h4>Sobre o artista</h4><p>${esc(a.bio)}</p>${a.works.length?`<p style="font-size:15px;color:var(--muted)"><i>Obras de referência:</i> ${esc(a.works.join('; '))}</p>`:''}`:''}
      <h4>Sobre o movimento</h4><p><i>${esc(m.period)}.</i> ${esc(m.text.split('. ').slice(0,2).join('. '))}.</p>
      <h4>Características</h4><ul style="padding-left:1.1em;margin:0">${m.chars.slice(0,4).map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
    </div>
    <div class="foot"><span>${pos+1} de ${list.length}</span><span style="font-style:italic">${esc(m.name)}</span></div>
  </div>`;
}
$('#mClose').onclick=closePost;
$('#mPrev').onclick=()=>{pos=(pos-1+list.length)%list.length;showPost()};
$('#mNext').onclick=()=>{pos=(pos+1)%list.length;showPost()};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closePost()});
document.addEventListener('keydown',e=>{if(!$('#modal').classList.contains('open'))return;
  if(e.key==='Escape')closePost(); if(e.key==='ArrowLeft')$('#mPrev').click(); if(e.key==='ArrowRight')$('#mNext').click();});
</script>
</body>
</html>
